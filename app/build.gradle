apply plugin: 'com.android.application'

android {
    namespace 'vn.vinicorp.youtubeoledlite'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.vinicorp.youtubeoledlite'
        minSdk 23
        targetSdk 35
        versionCode 15
        versionName '2.4.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
